{% extends 'base.html' %}

{% block title %}Confirm Deletion | MediCare HMS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 text-center">
                <div class="bg-danger-subtle text-danger rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.75rem;">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h4 class="fw-bold mb-2">Confirm Deletion</h4>
                <p class="text-muted small mb-4">
                    Are you sure you want to delete <strong>{{ object_name }}</strong>? This action will permanently remove the record and cannot be undone.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url cancel_url %}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">
                            Yes, Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
